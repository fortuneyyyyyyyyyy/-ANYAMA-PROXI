services:
  - type: web
    name: anyama-proxi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --timeout 30 wsgi:app
    healthCheckPath: /health/ready
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
